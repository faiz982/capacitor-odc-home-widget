<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Home Widget Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1b1b1f;
        --muted: #5f6368;
        --accent: #1a73e8;
        --border: #e0e0e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --card: #202124;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --accent: #8ab4f8;
          --border: #3c4043;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px 32px;
        font: 15px/1.4 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 { font-size: 22px; margin: 4px 0 4px; }
      p.lead { margin: 0 0 16px; color: var(--muted); }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      h2 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
      input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      button {
        flex: 1 1 auto;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
      button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
      #status { font-size: 13px; color: var(--muted); }
      #log {
        font: 12px/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
        max-height: 220px;
        overflow: auto;
        margin: 0;
      }
      #tap {
        display: none;
        background: var(--accent);
        color: #fff;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Home Widget Demo</h1>
    <p class="lead">Set data here, then add the widgets from your launcher's widget picker.</p>

    <section id="tap"></section>

    <section>
      <h2>Count widget</h2>
      <label for="countValue">Value</label>
      <input id="countValue" type="number" value="12" />
      <div class="row">
        <button data-set="COUNT">Set count widget</button>
        <button class="secondary" data-pin="COUNT">Pin</button>
      </div>
    </section>

    <section>
      <h2>List widget</h2>
      <label for="listItems">Items (comma separated, max 3)</label>
      <input id="listItems" value="Purchase order #4512, Leave request: J. Smith, Invoice INV-0098" />
      <div class="row">
        <button data-set="LIST">Set list widget</button>
        <button class="secondary" data-pin="LIST">Pin</button>
      </div>
    </section>

    <section>
      <h2>Actions widget</h2>
      <div class="row">
        <button data-set="ACTIONS">Set actions widget</button>
        <button class="secondary" data-pin="ACTIONS">Pin</button>
      </div>
    </section>

    <section>
      <h2>Status</h2>
      <div id="status">Checking plugin…</div>
      <div class="row">
        <button class="secondary" id="counts">Count installed widgets</button>
        <button class="secondary" id="clearAll">Clear all widgets</button>
      </div>
    </section>

    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>

    <script src="vendor/capacitor.js"></script>
    <script src="vendor/odc-home-widget.js"></script>
    <script src="app.js"></script>
  </body>
</html>
